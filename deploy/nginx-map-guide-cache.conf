# 将以下 location 片段合并到 map-guide 对应的 Nginx server 块。
# 应先备份线上配置，执行 nginx -t，通过后再 reload。

location ^~ /assets/map/tiles/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
