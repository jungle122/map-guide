<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="粤韵童行黄连古村互动导览地图">
  <title>黄连古村互动导览</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/map.css?v=20260818-2">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body class="map-app">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div>
          <p>粤韵童行 · 互动导览</p>
          <h1>黄连古村</h1>
        </div>
      </div>
      <button id="toggleAnnotator" class="topbar-action" type="button" aria-pressed="false" hidden>坐标标注</button>
    </header>

    <main class="map-stage">
      <section class="map-shell" aria-label="黄连古村互动导览地图">
        <div id="mapViewport" class="map-viewport" tabindex="0" aria-describedby="mapHint">
          <div id="mapCanvas" class="map-canvas">
            <img class="map-image" src="assets/map/huanglian-map.jpg" alt="黄连古村手绘导览地图" draggable="false">
          </div>
          <div id="hotspotLayer" class="hotspot-layer"></div>
          <div id="hotspotLabelLayer" class="hotspot-label-layer" aria-hidden="true"></div>
        </div>

        <div class="map-toolbar" aria-label="地图控制">
          <button id="zoomIn" type="button" aria-label="放大地图"><span aria-hidden="true">＋</span></button>
          <output id="zoomValue" aria-live="polite">100%</output>
          <button id="zoomOut" type="button" aria-label="缩小地图"><span aria-hidden="true">−</span></button>
          <span class="toolbar-rule" aria-hidden="true"></span>
          <button id="resetView" class="reset-button" type="button">复位</button>
        </div>

        <section id="spotQuickCard" class="spot-card" aria-labelledby="spotCardTitle" hidden>
          <button id="closeSpotCard" class="spot-card-close" type="button" aria-label="收起地点卡片">×</button>
          <div class="spot-card-sign" aria-hidden="true"><span></span></div>
          <div class="spot-card-copy">
            <p>当前地点</p>
            <h2 id="spotCardTitle"></h2>
            <span id="spotCardStatus">童谣导览 · 真实导航待补充</span>
          </div>
          <div class="spot-card-actions">
            <button id="viewSpotDetail" class="spot-card-secondary" type="button">查看介绍</button>
            <button id="openNavigation" class="spot-card-primary" type="button">一键导航</button>
          </div>
        </section>

        <p id="mapHint" class="map-hint">单指拖动 · 双指或滚轮缩放</p>
        <p class="placeholder-notice">首批 4 个童谣景点 · 内容持续完善中</p>
      </section>

      <aside id="annotatorPanel" class="annotator-panel" hidden aria-labelledby="annotatorTitle">
        <div class="annotator-heading">
          <div>
            <p>开发辅助工具</p>
            <h2 id="annotatorTitle">热点坐标标注</h2>
          </div>
          <button id="closeAnnotator" type="button" aria-label="关闭坐标标注">×</button>
        </div>
        <p>先选择景点，再点击地图放置；也可以直接拖动大头针微调。</p>
        <label class="spot-selector">
          <span>当前景点</span>
          <select id="annotationSpot"></select>
        </label>
        <div class="coordinate-readout">
          <label>X <output id="coordinateX">--</output>%</label>
          <label>Y <output id="coordinateY">--</output>%</label>
          <button id="copyCoordinate" type="button" disabled>复制坐标</button>
        </div>
        <div class="annotation-actions">
          <button id="copyAllCoordinates" type="button">复制全部坐标</button>
        </div>
        <div id="coordinateList" class="coordinate-list"></div>
        <output id="annotationStatus" class="status-message" aria-live="polite">请选择景点后点击地图。</output>
      </aside>
    </main>
  </div>

  <div id="spotModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="modal-close" type="button" aria-label="关闭详情">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="navigationSheet" class="navigation-sheet" hidden>
    <div class="navigation-backdrop" data-close-navigation></div>
    <section class="navigation-dialog" role="dialog" aria-modal="true" aria-labelledby="navigationTitle">
      <div class="navigation-heading">
        <div>
          <p>选择打开方式</p>
          <h2 id="navigationTitle">前往目的地</h2>
        </div>
        <button id="closeNavigation" type="button" aria-label="关闭导航选择">×</button>
      </div>
      <p id="navigationHint" class="navigation-hint">接入真实经纬度后，可选择常用地图规划路线。</p>
      <div id="navigationOptions" class="navigation-options">
        <button type="button" data-map-provider="amap"><span class="provider-mark provider-amap">高</span><span><strong>高德地图</strong><small>网页路线 · 可继续打开 App</small></span><i>›</i></button>
        <button type="button" data-map-provider="baidu"><span class="provider-mark provider-baidu">百</span><span><strong>百度地图</strong><small>网页路线 · 可继续打开 App</small></span><i>›</i></button>
        <button type="button" data-map-provider="tencent"><span class="provider-mark provider-tencent">腾</span><span><strong>腾讯地图</strong><small>网页路线 · 可继续打开 App</small></span><i>›</i></button>
        <button type="button" data-map-provider="apple" data-apple-option><span class="provider-mark provider-apple">苹</span><span><strong>Apple 地图</strong><small>仅在 iPhone、iPad 和 Mac 显示</small></span><i>›</i></button>
      </div>
      <button id="copyPlaceInfo" class="copy-place-button" type="button">复制地点信息</button>
      <output id="navigationStatus" class="navigation-status" aria-live="polite"></output>
    </section>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/spots/shishijiao.js" defer></script>
  <script src="js/spots/tianhou-xiancan.js" defer></script>
  <script src="js/spots/longshi.js" defer></script>
  <script src="js/spots/jiyaxiang.js" defer></script>
  <script src="js/media.js" defer></script>
  <script src="js/modal.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/spot-card.js" defer></script>
  <script src="js/map.js?v=20260818-2" defer></script>
  <script src="js/annotator.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
