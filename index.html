<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="粤韵童行黄连古村联动导览地图">
  <title>黄连古村联动导览</title>
  <link rel="icon" href="assets/favicon-blue.jpg?v=20260823-1" type="image/jpeg">
  <link rel="stylesheet" href="css/main.css?v=20260823-5">
  <link rel="stylesheet" href="css/map.css?v=20260823-8">
  <link rel="stylesheet" href="css/modal.css?v=20260823-4">
  <link rel="stylesheet" href="css/routes.css?v=20260823-1">
</head>
<body class="map-app">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <button id="openVillageIntro" class="brand-intro-trigger" type="button" aria-label="查看黄连古村介绍"></button>
        <img class="brand-mark" src="assets/favicon-blue.jpg?v=20260823-1" alt="">
        <div>
          <p>粤韵童行·童谣联动地图</p>
          <h1>黄连古村</h1>
        </div>
      </div>
      <button id="toggleAnnotator" class="topbar-action" type="button" aria-pressed="false" hidden>坐标标注</button>
    </header>

    <section class="route-entry-bar" aria-label="游玩线路入口">
      <button id="openRouteEntry" class="route-entry-button" type="button" aria-label="打开游玩路线推荐">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        线路推荐
      </button>
    </section>

    <main class="map-stage">
      <section class="map-shell" aria-label="黄连古村联动导览地图">
        <div id="mapViewport" class="map-viewport" tabindex="0" aria-describedby="mapHint">
          <div id="mapViewer" class="map-viewer" aria-hidden="true"></div>
          <div id="mapCanvas" class="map-canvas">
            <img class="map-image" data-preview-src="assets/map/huanglian-map-preview.webp" data-full-src="assets/map/huanglian-map.jpg" alt="黄连古村手绘导览地图" draggable="false" decoding="async">
            <div id="routeLayer" class="route-layer" aria-hidden="true"></div>
            <footer class="site-record">
              <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">赣ICP备2026002165号-2</a>
            </footer>
          </div>
          <div id="hotspotLayer" class="hotspot-layer"></div>
        </div>

        <div class="map-toolbar" aria-label="地图控制">
          <button id="zoomIn" type="button" aria-label="放大地图"><span aria-hidden="true">＋</span></button>
          <output id="zoomValue" aria-live="polite">100%</output>
          <button id="zoomOut" type="button" aria-label="缩小地图"><span aria-hidden="true">−</span></button>
          <span class="toolbar-rule" aria-hidden="true"></span>
          <button id="resetView" class="reset-button" type="button">复位</button>
        </div>

        <div id="routeStatusPill" class="route-status-pill" hidden>
          <span class="route-status-dot"></span>
          <span class="route-status-name"></span>
          <span class="route-status-duration"></span>
          <button id="routeStatusClose" type="button" aria-label="关闭路线">×</button>
        </div>

        <section id="spotQuickCard" class="spot-card" aria-labelledby="spotCardTitle" hidden>
          <button id="closeSpotCard" class="spot-card-close" type="button" aria-label="收起地点卡片">×</button>
          <img id="spotCardIcon" class="spot-card-icon" src="" alt="" aria-hidden="true" hidden>
          <div class="spot-card-copy">
            <p>当前地点</p>
            <h2 id="spotCardTitle"></h2>
          </div>
          <div class="spot-card-actions">
            <button id="viewSpotDetail" class="spot-card-secondary" type="button">查看介绍</button>
            <button id="openNavigation" class="spot-card-primary" type="button">一键导航</button>
          </div>
        </section>

        <p id="mapHint" class="map-hint">单指拖动 · 双指或滚轮缩放</p>
        <output id="mapLoadStatus" class="map-load-status" aria-live="polite" hidden></output>
      </section>

      <aside id="annotatorPanel" class="annotator-panel" hidden aria-labelledby="annotatorTitle">
        <div class="annotator-heading">
          <div>
            <p>开发辅助工具</p>
            <h2 id="annotatorTitle">热点坐标标注</h2>
          </div>
          <button id="closeAnnotator" type="button" aria-label="关闭坐标标注">×</button>
        </div>
        <p>所有调整只在当前页面生效，刷新后自动恢复。选择点位后点击地图放置，也可以直接拖动微调。</p>
        <label class="temporary-spot-name">
          <span>临时点名称</span>
          <span class="temporary-spot-create">
            <input id="temporarySpotName" type="text" maxlength="30" placeholder="留空则自动编号">
            <button id="addTemporarySpot" type="button">添加临时点</button>
          </span>
        </label>
        <label class="spot-selector">
          <span>当前点位</span>
          <select id="annotationSpot"></select>
        </label>
        <div class="coordinate-readout">
          <label>X <output id="coordinateX">--</output>%</label>
          <label>Y <output id="coordinateY">--</output>%</label>
          <button id="copyCoordinate" type="button" disabled>复制坐标</button>
        </div>
        <div class="annotation-actions">
          <button id="copyAllCoordinates" type="button">复制全部坐标</button>
          <button id="deleteCurrentSpot" class="annotation-danger" type="button">删除当前点</button>
          <button id="clearTemporarySpots" class="annotation-quiet" type="button">清空临时点</button>
          <button id="resetAnnotationSession" class="annotation-quiet" type="button">恢复初始状态</button>
        </div>
        <div id="coordinateList" class="coordinate-list"></div>
        <output id="annotationStatus" class="status-message" aria-live="polite">请选择景点后点击地图。</output>
      </aside>
    </main>
  </div>

  <div id="spotModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModal" class="modal-close" type="button" aria-label="关闭详情">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="navigationSheet" class="navigation-sheet" hidden>
    <div class="navigation-backdrop" data-close-navigation></div>
    <section class="navigation-dialog" role="dialog" aria-modal="true" aria-labelledby="navigationTitle">
      <div class="navigation-heading">
        <div>
          <p>选择打开方式</p>
          <h2 id="navigationTitle">前往目的地</h2>
        </div>
        <button id="closeNavigation" type="button" aria-label="关闭导航选择">×</button>
      </div>
      <p id="navigationHint" class="navigation-hint">接入真实经纬度后，可选择常用地图规划路线。</p>
      <div id="navigationOptions" class="navigation-options">
        <button type="button" data-map-provider="amap"><img class="provider-mark provider-amap" src="assets/icons/amap.jpg" alt="高德地图"/><span><strong>高德地图</strong></span><i>›</i></button>
        <button type="button" data-map-provider="baidu"><img class="provider-mark provider-baidu" src="assets/icons/baidu.jpg" alt="百度地图"/><span><strong>百度地图</strong></span><i>›</i></button>
        <button type="button" data-map-provider="tencent"><img class="provider-mark provider-tencent" src="assets/icons/tencent.jpg" alt="腾讯地图"/><span><strong>腾讯地图</strong></span><i>›</i></button>
        <button type="button" data-map-provider="apple" data-apple-option><span class="provider-mark provider-apple"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="38" height="38"><rect width="120" height="120" rx="24" fill="#000"/><text x="60" y="75" text-anchor="middle" fill="white" font-family="Arial" font-size="50">🍎</text></svg></span><span><strong>Apple 地图</strong></span><i>›</i></button>
      </div>
      <button id="copyPlaceInfo" class="copy-place-button" type="button">复制地点信息</button>
      <output id="navigationStatus" class="navigation-status" aria-live="polite"></output>
    </section>
  </div>

  <div id="routeSheet" class="route-sheet" hidden>
    <div class="route-backdrop" data-close-route></div>
    <section class="route-dialog" role="dialog" aria-modal="true" aria-labelledby="routeSheetTitle">
      <div class="route-heading">
        <div>
          <p>云赏黄连 · 游玩线路</p>
          <h2 id="routeSheetTitle">选择一条路线</h2>
        </div>
        <button id="closeRouteSheet" type="button" aria-label="关闭线路选择">×</button>
      </div>
      <div class="route-cards">
        <button class="route-card" type="button" data-route-id="halfDay">
          <span class="route-card-badge" style="background:#b94e3d">半日游</span>
          <strong>古村精华线</strong>
          <small>约 3 小时 · 7 站</small>
          <span class="route-card-desc">从黄连村史馆出发，经游客服务中心、顺德厨师文化展示馆、雪圃学校、澳心何氏先祠、画家艺术村，最后到达石狮脚。</span>
        </button>
        <button class="route-card" type="button" data-route-id="fullDay">
          <span class="route-card-badge" style="background:#3f633c">一日游</span>
          <strong>古村深度环线</strong>
          <small>约 6 小时 · 13 站</small>
          <span class="route-card-desc">从黄连村史馆出发，依次游览游客服务中心、顺德厨师文化展示馆、雪圃学校、仓沮圣庙、石龟祠公园、古庙公园、黄连龙虱馆、滨水公园、南大将军古庙、澳心何氏先祠、画家艺术村和石狮脚。</span>
        </button>
      </div>
    </section>
  </div>

  <script src="js/data.js" defer></script>
  <script src="js/spots/shishijiao.js?v=20260823-3" defer></script>
  <script src="js/spots/tianhou-xiancan.js?v=20260823-3" defer></script>
  <script src="js/spots/longshi.js?v=20260823-3" defer></script>
  <script src="js/spots/jiyaxiang.js?v=20260823-3" defer></script>
  <script src="js/spots/fanhou-geci.js?v=20260823-6" defer></script>
  <script src="js/spots/lianjiqiao.js?v=20260823-5" defer></script>
  <script src="js/spots/cultural-spots.js?v=20260823-1" defer></script>
  <script src="js/routes.js?v=20260823-1" defer></script>
  <script src="js/route-layer.js?v=20260823-1" defer></script>
  <script src="js/route-entry.js?v=20260823-1" defer></script>
  <script src="js/media.js" defer></script>
  <script src="js/modal.js?v=20260823-5" defer></script>
  <script src="js/navigation.js?v=20260823-1" defer></script>
  <script src="js/spot-card.js?v=20260823-1" defer></script>
  <script src="js/map.js?v=20260823-5" defer></script>
  <script src="js/vendor/openseadragon/6.1.0/openseadragon.min.js" defer></script>
  <script src="js/map-tiles.js?v=20260823-4" defer></script>
  <script src="js/annotator.js?v=20260823-4" defer></script>
  <script src="js/village-intro.js?v=20260823-1" defer></script>
  <script src="js/app.js?v=20260823-2" defer></script>
</body>
</html>
